name: Build NRO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Switch dependencies
        run: >-
          dkp-pacman -Syu --needed --noconfirm
          switch-dev switch-sdl2 switch-sdl2_mixer switch-sdl2_ttf
          switch-sdl2_image switch-ffmpeg switch-libjpeg-turbo
          switch-curl switch-libxml2

      - name: Build release NRO
        run: make -j"$(nproc)" DEV=0

      - name: Upload NRO
        uses: actions/upload-artifact@v7
        with:
          name: Gatefold-nro
          path: Gatefold.nro
          if-no-files-found: error
